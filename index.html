<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal collections and archives">
  <title>Collections</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">PERSONAL ARCHIVE</p>
        <h1>COLLECTIONS</h1>
        <p class="intro">Independent collections, gathered in one place.</p>
      </div>
      <div class="header-status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="portal-status">Loading collection summaries…</span>
      </div>
    </header>

    <main>
      <section id="collection-grid" class="collection-grid" aria-label="Collections">
        <noscript>This page needs JavaScript to load the collection summaries.</noscript>
      </section>
    </main>

    <footer class="site-footer">
      <span>Collection portal</span>
      <span id="footer-updated"></span>
    </footer>
  </div>

  <template id="collection-card-template">
    <article class="collection-card is-loading">
      <div class="card-accent" aria-hidden="true"></div>
      <div class="card-heading">
        <div class="collection-icon" aria-hidden="true"></div>
        <div class="heading-copy">
          <p class="collection-kicker"></p>
          <h2 class="collection-title"></h2>
        </div>
      </div>
      <p class="collection-description"></p>
      <div class="metrics" aria-label="Collection metrics"></div>
      <div class="card-footer">
        <span class="updated-label"></span>
        <a class="open-link" href="#">Open collection <span aria-hidden="true">→</span></a>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
